[project]
name = "multimodal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.24.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
agent-runtime = [
    "httpx>=0.28,<1",
    "logfire>=4,<6",
    "pydantic>=2.10,<3",
]
dev = [
    "ipykernel>=7.3.0",
    "multimodal-backend",
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
multimodal-backend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["cronjob", "backend/tests"]
pythonpath = [".", "backend"]

[tool.ruff]
target-version = "py312"
# Exclude the empty placeholder until it contains a valid notebook.
extend-exclude = ["data_view.ipynb"]

[project]
name = "multimodal-backend"
version = "0.1.0"
description = "Collection image search API and ingestion service"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlmodel>=0.0.24,<1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "qdrant-client>=1.17,<1.18",
    "google-genai>=2.24.0",
    "pillow>=11,<13",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "modal>=1.0,<2",
    "logfire[fastapi,google-genai]>=4.41,<5",
    "opentelemetry-proto>=1.30,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
